services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-google/gemma-4-31b-it:free,nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-26b-a4b-it:free}
      APP_URL: ${APP_URL:-http://localhost:8000}
      RATE_LIMIT_PER_10MIN: ${RATE_LIMIT_PER_10MIN:-15}